<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Gym">
<title>Mi Gym</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a;
  --text:#f2f3f5; --muted:#9aa1ad; --accent:#ff5a1f; --accent2:#ffb020; --ok:#2ecc71;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header button{background:var(--card2);border:0;color:var(--text);width:38px;height:38px;border-radius:12px;font-size:20px}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:16px;max-width:640px;margin:0 auto}
.section-title{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1.2px;margin:6px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;display:block;color:inherit;text-decoration:none;width:100%;text-align:left;font:inherit}
.card:active{transform:scale(.985)}
.hero{background:linear-gradient(135deg,#ff5a1f,#ff8a1f 60%,#ffb020);border:0;color:#111;padding:22px}
.hero .big{font-size:38px;font-weight:900;letter-spacing:1px}
.hero .sub{font-weight:600;opacity:.85}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted);margin-right:6px}
.pill.today{background:var(--accent);color:#111;font-weight:700}
.day-name{font-size:13px;color:var(--accent2);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.day-title{font-size:20px;font-weight:800;margin:2px 0}
.muted{color:var(--muted);font-size:14px}
.chev{color:var(--muted);font-size:22px}
.thumb{width:72px;height:56px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.num{width:28px;height:28px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.done .num{background:var(--ok);color:#111}
.ex-name{font-weight:700;font-size:16px}
.anim{position:relative;width:100%;aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:#fff;margin-bottom:14px}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.anim .f1{animation:flip 2.2s infinite}
@keyframes flip{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.anim.paused .f1{animation-play-state:paused}
.anim .tag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 8px;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12px}
ol,ul{margin:6px 0 0;padding-left:20px;line-height:1.5}
li{margin-bottom:6px}
.warn li::marker{content:"✗  ";color:#ff5d5d}
.note{background:#2a2110;border:1px solid #5a4314;color:#ffd58a;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:8px 10px}
.set input{width:80px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px;font-size:16px;text-align:center}
.set .chk{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:transparent;color:transparent;font-size:20px;flex:none}
.set.ok .chk{background:var(--ok);border-color:var(--ok);color:#111}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:700;background:var(--card2);color:var(--text);text-decoration:none;margin-bottom:10px}
.btn.primary{background:var(--accent);color:#111}
.progress{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--accent);color:#111;border-radius:18px;padding:12px 16px;display:none;align-items:center;gap:12px;font-weight:800;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#timer.show{display:flex}
#timer .t{font-size:28px;flex:1;font-variant-numeric:tabular-nums}
#timer button{background:#111;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.rest-card{text-align:center;padding:40px 16px}
.rest-card .big{font-size:60px}
.tip{font-size:14px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Atrás" style="visibility:hidden">‹</button>
  <h1 id="title">Mi Gym</h1>
</header>
<main id="app"></main>
<div id="timer"><span>⏱</span><span class="t" id="tval">0:00</span><button id="tplus">+15s</button><button id="tstop">Listo</button></div>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $("#app");
const DAYS_JS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const todayName = DAYS_JS[new Date().getDay()];
const img = id => "img/" + (EXERCISES[id].img || id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// Las series marcadas se guardan por semana para que cada semana empiece limpia
function weekKey(){ const d=new Date(); const t=new Date(d.getFullYear(),0,1); return d.getFullYear()+"-w"+Math.ceil(((d-t)/864e5+t.getDay()+1)/7); }
const doneKey = (r,di,ei) => `done:${weekKey()}:${r}:${di}:${ei}`;
const weightKey = id => `w:${id}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setHeader(title, back){
  $("#title").textContent = title;
  const b = $("#back");
  b.style.visibility = back ? "visible" : "hidden";
  b.onclick = () => { location.hash = back; };
}

function home(){
  setHeader("Mi Gym", null);
  app.innerHTML = `
    <div class="section-title">Rutinas</div>
    ${ROUTINES.map(r => `
      <a class="card hero" href="#/r/${r.id}">
        <div class="big">${esc(r.name)}</div>
        <div class="sub">${esc(r.subtitle)}</div>
      </a>`).join("")}
    <div class="section-title" style="margin-top:22px">Tu equipo</div>
    <div class="card tip">
      Tren superior: mancuernas, 1 banco plano, 1 banco inclinable y 2 jaulas (barra + barra de dominadas).<br>
      Pierna: máquinas (prensa, hack, extensiones, curl femoral, pantorrilla) + jaulas.<br><br>
      Toda la rutina está hecha solo con eso. 💪
    </div>`;
}

function dayProgress(r, di){
  const d = r.days[di]; let tot=0, ok=0;
  d.list.forEach((x,ei) => { tot += x.sets; ok += store.get(doneKey(r.id,di,ei), []).filter(Boolean).length; });
  return {tot, ok};
}

function routine(rid){
  const r = ROUTINES.find(x => x.id === rid); if(!r) return home();
  setHeader(r.name, "#/");
  app.innerHTML = `<div class="section-title">Días</div>` + r.days.map((d,di) => {
    const p = dayProgress(r, di);
    const isToday = d.day === todayName;
    return `<a class="card" href="#/r/${r.id}/${di}">
      <div class="row">
        <div class="grow">
          <div class="day-name">${d.day} ${isToday ? '<span class="pill today">HOY</span>' : ''}</div>
          <div class="day-title">${esc(d.title)}</div>
          <div class="muted">${esc(d.focus)}</div>
          ${d.rest ? "" : `<div style="margin-top:8px"><span class="pill">${d.list.length} ejercicios</span><span class="pill">⏱ ${d.time}</span>${p.ok ? `<span class="pill">✓ ${p.ok}/${p.tot}</span>` : ""}</div>`}
        </div>
        <div class="chev">›</div>
      </div></a>`;
  }).join("");
}

function day(rid, di){
  const r = ROUTINES.find(x => x.id === rid); const d = r && r.days[di]; if(!d) return home();
  setHeader(`${d.day} · ${d.title}`, `#/r/${rid}`);
  if(d.rest){
    app.innerHTML = `<div class="card rest-card"><div class="big">😴</div><h2>Descanso total</h2>
      <p class="tip">El músculo crece descansando. Duerme bien, come suficiente proteína y toma agua. Si quieres, camina un rato, pero nada pesado.</p></div>`;
    return;
  }
  const p = dayProgress(r, di);
  app.innerHTML = `
    <div class="card">
      <div class="muted">${esc(d.focus)}</div>
      <div class="progress"><i style="width:${p.tot ? p.ok/p.tot*100 : 0}%"></i></div>
      <div class="muted">${p.ok}/${p.tot} series · ⏱ ${d.time}</div>
    </div>
    <div class="note">🔥 Calienta 5–10 min y haz 1–2 series ligeras del primer ejercicio antes de empezar.</div>
    ${d.list.map((x,ei) => {
      const e = EXERCISES[x.id];
      const ok = store.get(doneKey(rid,di,ei), []).filter(Boolean).length;
      return `<a class="card ${ok>=x.sets?'done':''}" href="#/r/${rid}/${di}/${ei}">
        <div class="row">
          <div class="num">${ok>=x.sets ? "✓" : ei+1}</div>
          <img class="thumb" src="${img(x.id)}/1.jpg" alt="" loading="lazy">
          <div class="grow">
            <div class="ex-name">${esc(e.name)}</div>
            <div class="muted">${x.sets} × ${esc(x.reps)} · desc. ${fmt(x.rest)}</div>
          </div>
          <div class="chev">›</div>
        </div></a>`;
    }).join("")}
    <button class="btn" id="reset">Reiniciar progreso de este día</button>`;
  $("#reset").onclick = () => {
    if(!confirm("¿Borrar las series marcadas de este día?")) return;
    d.list.forEach((x,ei) => store.set(doneKey(rid,di,ei), []));
    day(rid, di);
  };
}

function exercise(rid, di, ei){
  const r = ROUTINES.find(x => x.id === rid); const d = r && r.days[di]; const x = d && d.list[ei];
  if(!x) return home();
  const e = EXERCISES[x.id];
  setHeader(e.name, `#/r/${rid}/${di}`);
  const done = store.get(doneKey(rid,di,ei), []);
  const weights = store.get(weightKey(x.id), []);
  const yt = "https://www.youtube.com/results?search_query=" + encodeURIComponent("como hacer " + e.name + " técnica correcta");
  const next = ei + 1 < d.list.length ? `#/r/${rid}/${di}/${ei+1}` : `#/r/${rid}/${di}`;
  app.innerHTML = `
    <div class="anim" id="anim">
      <img src="${img(x.id)}/0.jpg" alt="Posición inicial">
      <img class="f1" src="${img(x.id)}/1.jpg" alt="Posición final">
      <span class="tag">Toca para pausar</span>
    </div>
    <div class="stats">
      <div class="stat"><b>${x.sets}</b><span>series</span></div>
      <div class="stat"><b>${esc(x.reps)}</b><span>reps</span></div>
      <div class="stat"><b>${fmt(x.rest)}</b><span>descanso</span></div>
    </div>
    <div class="card"><div class="muted">🏋️ ${esc(e.equip)}</div><div class="muted" style="margin-top:4px">🎯 ${esc(e.muscles)}</div></div>
    ${e.note ? `<div class="note">💡 ${esc(e.note)}</div>` : ""}
    <div class="card">
      <div class="section-title" style="margin-top:0">Series de hoy</div>
      <div class="sets">
        ${Array.from({length:x.sets}, (_,i) => `
          <div class="set ${done[i]?'ok':''}" data-i="${i}">
            <b style="width:64px">Serie ${i+1}</b>
            <input inputmode="decimal" placeholder="kg" value="${weights[i] ?? ""}" aria-label="Peso serie ${i+1}">
            <span class="muted grow">kg</span>
            <button class="chk" aria-label="Marcar serie">✓</button>
          </div>`).join("")}
      </div>
      <p class="tip" style="margin:10px 0 0">Al marcar una serie arranca el descanso. El peso se guarda para la próxima vez.</p>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">Cómo se hace</div>
      <ol>${e.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">Errores comunes</div>
      <ul class="warn">${e.errors.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    </div>
    <a class="btn" href="${yt}" target="_blank" rel="noopener">▶ Ver video en YouTube</a>
    <a class="btn primary" href="${next}">${ei + 1 < d.list.length ? "Siguiente ejercicio ›" : "Terminar día ✓"}</a>`;

  $("#anim").onclick = function(){ this.classList.toggle("paused"); };
  app.querySelectorAll(".set").forEach(row => {
    const i = +row.dataset.i;
    row.querySelector("input").onchange = ev => {
      const w = store.get(weightKey(x.id), []); w[i] = ev.target.value; store.set(weightKey(x.id), w);
    };
    row.querySelector(".chk").onclick = () => {
      const dn = store.get(doneKey(rid,di,ei), []); dn[i] = !dn[i]; store.set(doneKey(rid,di,ei), dn);
      row.classList.toggle("ok", dn[i]);
      if(dn[i]) startTimer(x.rest);
    };
  });
}

function fmt(s){ const m = Math.floor(s/60), r = s%60; return r ? `${m}:${String(r).padStart(2,"0")}` : `${m} min`; }

// Temporizador de descanso
let tEnd = 0, tInt = null;
function startTimer(sec){
  tEnd = Date.now() + sec*1000;
  $("#timer").classList.add("show");
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
}
function tick(){
  const left = Math.max(0, Math.round((tEnd - Date.now())/1000));
  $("#tval").textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  if(left <= 0){
    clearInterval(tInt);
    $("#tval").textContent = "¡A darle!";
    if(navigator.vibrate) navigator.vibrate([300,150,300]);
    beep();
  }
}
function beep(){ try{ const c = new (window.AudioContext||window.webkitAudioContext)(); const o = c.createOscillator(); o.frequency.value = 880; o.connect(c.destination); o.start(); o.stop(c.currentTime + .4); }catch(e){} }
$("#tplus").onclick = () => { tEnd = Math.max(tEnd, Date.now()) + 15000; clearInterval(tInt); tInt = setInterval(tick, 250); tick(); };
$("#tstop").onclick = () => { clearInterval(tInt); $("#timer").classList.remove("show"); };

function route(){
  const p = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(p[0] === "r" && p.length === 2) return routine(p[1]);
  if(p[0] === "r" && p.length === 3) return day(p[1], +p[2]);
  if(p[0] === "r" && p.length === 4) return exercise(p[1], +p[2], +p[3]);
  home();
}
window.addEventListener("hashchange", route);
route();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
